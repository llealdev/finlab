services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: finlab-api:latest
    restart: unless-stopped
    env_file:
      - api/.env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - model-cache:/cache
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  model-cache:
