[project]
name = "finlab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"

# Runtime dependencies of the api/ service only — this is what the Docker
# image installs. Keep it minimal: fastembed runs on onnxruntime (CPU), so
# nothing here pulls torch.
dependencies = [
    "fastapi>=0.136.3",
    "instructor>=1.15.3",
    "openai>=2.41.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "qdrant-client[fastembed]>=1.18.0",
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
# Pipeline de ingestão (ingestion/). Pesado: puxa torch + CUDA (~5 GB).
ingestion = [
    "edgar>=5.6.3",
    "edgartools>=5.36.0",
    "hdbscan>=0.8.44",
    "sentence-transformers>=5.6.0",
    "trafilatura>=2.1.0",
    "transformers>=5.12.1",
    "yfinance>=1.4.1",
]
# Suíte de avaliação (evaluations/).
evaluations = [
    "langfuse>=4.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 120
extend-exclude = ['notebooks', 'evaluations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PLC', 'PLE', 'PLW',
    'C90', 'N', 'S', 'RET', 'SIM', 'PERF']

[tool.ruff.format]
preview = true
